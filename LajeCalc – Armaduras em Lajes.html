<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LajeCalc – Armaduras em Lajes</title>
<style>
:root{--bg:#e9edf2;--panel:#fff;--bar:#1b2735;--barfg:#e8eef5;--ink:#1c2733;--mut:#5b6977;--line:#c9d3dd;--acc:#1f6fd1;--accfg:#fff;--ok:#17803a;--warn:#a85f00;--bad:#c0392b;--fld:#f6f8fb;--hd:#dfe6ee;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12181f;--panel:#1b232c;--bar:#0b1015;--barfg:#dbe4ed;--ink:#e5ecf3;--mut:#93a1af;--line:#323f4c;--acc:#4c9aff;--accfg:#06101d;--ok:#4cc27a;--warn:#e3a43d;--bad:#ef7a6b;--fld:#141b22;--hd:#25303b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12181f;--panel:#1b232c;--bar:#0b1015;--barfg:#dbe4ed;--ink:#e5ecf3;--mut:#93a1af;--line:#323f4c;--acc:#4c9aff;--accfg:#06101d;--ok:#4cc27a;--warn:#e3a43d;--bad:#ef7a6b;--fld:#141b22;--hd:#25303b;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bar);color:var(--barfg);display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:8px 14px;border-bottom:2px solid var(--acc)}
.brand{font-weight:700;letter-spacing:.3px}.brand span{font-weight:400;opacity:.7;margin-left:8px;font-size:12px}
nav{display:flex;gap:4px;margin-left:auto}
.tab{background:transparent;color:inherit;border:1px solid transparent;padding:6px 12px;border-radius:3px;font:inherit;cursor:pointer}
.tab[aria-current=true]{background:var(--acc);color:var(--accfg)}
main{max-width:1180px;margin:0 auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px;align-items:start}
.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.panel h2,.card h3{margin:0;padding:7px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;background:var(--hd);border-left:4px solid var(--acc)}
.card h3 small{text-transform:none;letter-spacing:0;font-weight:400;color:var(--mut);margin-left:6px}
.fs{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;padding:12px}
.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}.f.w{grid-column:1/-1}
.in{display:flex;align-items:center;border:1px solid var(--line);background:var(--fld);border-radius:3px}
.in:focus-within{border-color:var(--acc)}
.in input,select{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:13px ui-monospace,Menlo,Consolas,monospace;padding:7px 8px;outline:0}
select{width:100%;border:1px solid var(--line);background:var(--fld);border-radius:3px;font-family:inherit}
.in em{font-style:normal;padding:0 8px;color:var(--mut);font-size:11px}
.ro .in{background:transparent;border-style:dashed}
.act{position:sticky;bottom:0;display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:14px;padding:10px 0;background:var(--bg)}
#msg{color:var(--bad);margin-right:auto;font-weight:600}
.btn{background:var(--acc);color:var(--accfg);border:0;border-radius:3px;padding:10px 28px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.ttl{margin:0 0 4px;font-size:18px}.sum{margin:0 0 12px;color:var(--mut)}
dl{margin:0;padding:6px 12px}dl div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dotted var(--line)}
dt{color:var(--mut)}dd{margin:0;font:600 13px ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
.chip{margin:8px 12px;padding:8px 10px;border:1px solid var(--acc);border-radius:3px;font:700 15px ui-monospace,Menlo,Consolas,monospace;text-align:center}
svg{display:block;width:100%;height:auto;padding:0 8px 10px;color:var(--ink)}
.st{margin:8px 12px 12px;padding:8px 10px;border-radius:3px;font-weight:700;text-align:center;border:1px solid currentColor}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.alert{margin:0 0 12px;padding:10px 12px;border:1px solid var(--warn);color:var(--warn);border-radius:4px;background:var(--panel);font-weight:600}
[hidden]{display:none!important}
</style></head>

</main>

const fld=([id,l,u,v,o])=>{const ro=o==='ro';
 const c=Array.isArray(o)?`<select id="f_${id}">${o.map(x=>`<option${x===v?' selected':''}>${x}</option>`).join('')}</select>`
 :`<div class="in"><input id="f_${id}" type="number" step="any" inputmode="decimal" value="${v??''}"${ro?' readonly tabindex="-1"':''}><em>${u}</em></div>`;
 return `<label class="f${ro?' ro':''}${W.includes(id)?' w':''}"><span>${l}</span>${c}</label>`};
$('form').innerHTML=SPEC.map(([t,a])=>`<section class="panel"><h2>${t}</h2><div class="fs">${a.map(fld).join('')}</div></section>`).join('');
const upd=()=>{const v=i=>parseFloat($('f_'+i).value)||0,pp=25*v('h')/100;$('f_pp').value=pp.toFixed(2);$('f_tot').value=(pp+v('prev')+v('q')).toFixed(2)};
$('form').addEventListener('input',upd);upd();
function read(){const d={};SPEC.forEach(([,a])=>a.forEach(([id,,,,o])=>{if(o==='ro')return;const e=$('f_'+id);d[id]=Array.isArray(o)?e.value:parseFloat(e.value)}));return d}
function chk(d){const Z=['prev','q','np','t1','t2'];
 for(const k in d){const v=d[k];if(typeof v==='number'&&!(Z.includes(k)?v>=0:v>0))return 'Preencha todos os campos com valores válidos (maiores que zero).'}
 if(d.ly<d.lx||d.nly<d.nlx)return 'Informe lx ≤ ly (λ = ly/lx ≥ 1) na laje analisada e na vizinha.'}
const bar=(c,p,h)=>`<svg viewBox="0 0 340 80" role="img" aria-label="Esquema da barra"><path d="${h?'M44 64V28H296V64':'M44 28H296'}" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><text x="170" y="18" text-anchor="middle" font-size="13" fill="currentColor">${c} cm</text>${h?`<text x="38" y="52" text-anchor="end" font-size="12" fill="currentColor">${p} cm</text><text x="302" y="52" font-size="12" fill="currentColor">${p} cm</text>`:''}</svg>`;
const card=(t,s,rows,lab,svg)=>`<article class="card"><h3>${t}<small>${s}</small></h3><dl>${rows.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl><div class="chip">${lab}</div>${svg}</article>`;
const rows=o=>[['Quantidade de barras',o.n+' barras'],['Espaçamento',o.s+' cm'],['Comprimento',o.c+' cm'],['Ponta reta',o.pr+' cm']];
function render(R,d){
 $('sum').textContent=`Caso ${R.caso} · λ = ${n(R.F1,2)} · p = ${n(R.p,2)} kN/m²`;
 const e=R.E,cl=e.st==='Ok!'?'ok':e.st==='Limite de serviço'?'warn':'bad';
 $('res').innerHTML=(R.aviso?`<div class="alert">${R.aviso}</div>`:'')+'<div class="grid">'
 +card('Direção X','armadura positiva',rows(R.X),R.X.label,bar(R.X.c,R.X.pr,d.gx==='Com Gancho'))
 +card('Direção Y','armadura positiva',rows(R.Y),R.Y.label,bar(R.Y.c,R.Y.pr,d.gy==='Com Gancho'))
 +card('Negativas','armadura sobre o apoio',rows(R.N),R.N.label,bar(R.N.c,R.N.pr,true))
 +`<article class="card"><h3>Verificação de ELS</h3><dl><div><dt>Flecha total da laje analisada</dt><dd>${n(e.dT,3)} cm</dd></div><div><dt>Flecha máxima</dt><dd>${n(e.lim,3)} cm</dd></div></dl><div class="st ${cl}">${e.st}</div></article></div>`}
let R=null;
function show(v){if(v==='resultados'&&!R)v='dados';$('v-dados').hidden=v!=='dados';$('v-resultados').hidden=v!=='resultados';$('t-res').hidden=!R;
 document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-current',t.dataset.v===v));
 try{if(location.hash!=='#'+v)location.hash=v}catch(x){}scrollTo(0,0)}
$('go').onclick=()=>{const d=read(),m=chk(d);if(m){$('msg').textContent=m;return}
 try{R=calc(d)}catch(x){$('msg').textContent=x.message;return}
 $('msg').textContent='';render(R,d);show('resultados')};
addEventListener('hashchange',()=>show(location.hash==='#resultados'?'resultados':'dados'));
show('dados');
</script></body></html>
